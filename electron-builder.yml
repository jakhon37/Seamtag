# Installers for Windows, macOS and Linux. Each is built on its own system in CI
# (.github/workflows/release.yml); `npm run dist` builds the one for this computer.
appId: io.github.jakhon37.seamtag
productName: Seamtag
executableName: seamtag
copyright: Copyright © 2026 Jakhongir Nodirov
artifactName: Seamtag-${version}-${os}-${arch}.${ext}
directories:
  output: release
  buildResources: resources
files:
  - out/**
  - package.json
  - "!**/*.map"
  # onnxruntime ships every platform's libraries: keep this one's, without CUDA
  - "!node_modules/onnxruntime-node/bin/**"
  - node_modules/onnxruntime-node/bin/napi-v6/${platform}/${arch}/**
  - "!node_modules/onnxruntime-node/bin/napi-v6/linux/*/libonnxruntime_providers_cuda.so"
  - "!node_modules/onnxruntime-node/bin/napi-v6/linux/*/libonnxruntime_providers_tensorrt.so"
  # On Windows, nor DirectML and the DirectX shader compiler: Microsoft's redistributables, under
  # their own terms, for GPU providers Seamtag doesn't use (it runs models on the CPU). onnxruntime.dll
  # delay-loads DirectML.dll, for a DirectML session only, and loads the other two only for WebGPU
  - "!node_modules/onnxruntime-node/bin/napi-v6/win32/*/DirectML.dll"
  - "!node_modules/onnxruntime-node/bin/napi-v6/win32/*/dxcompiler.dll"
  - "!node_modules/onnxruntime-node/bin/napi-v6/win32/*/dxil.dll"
# THIRD-PARTY-NOTICES.txt made again from this system's packages, and every file below checked,
# before anything is packed: npm run dist makes it too, but the release workflow calls
# electron-builder itself, and electron-builder only warns of a missing file
beforePack: ./scripts/notices.mjs
extraResources:
  # CLIP's vocabulary, for YOLO-World's word prompts
  - from: resources/clip
    to: clip
  # Seamtag's licence, the notice of the code in it from other projects, and the licences of
  # the software it carries, which Help > About Seamtag shows
  - from: LICENSE
    to: legal/LICENSE
  - from: NOTICE.md
    to: legal/NOTICE.md
  - from: THIRD-PARTY-NOTICES.txt
    to: legal/THIRD-PARTY-NOTICES.txt
asarUnpack:
  - node_modules/sharp/**
  - node_modules/@img/**
  - node_modules/onnxruntime-node/**
# sharp and onnxruntime come prebuilt for Node-API: nothing to compile
npmRebuild: false
extraMetadata:
  main: out/main/index.js
fileAssociations: []
# Icons from docs/mark/icons.cjs: each carries the small mark at the sizes where detail would turn to noise
win:
  icon: resources/icon.ico
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  shortcutName: Seamtag
mac:
  icon: resources/icon.icns
  category: public.app-category.graphics-design
  target:
    - target: dmg
  # Ad-hoc signed, so it runs on Apple silicon; not notarised (see the README)
  identity: "-"
  hardenedRuntime: false
  # electron-builder leaves Electron's and Chromium's licences out of a Mac app, which Windows
  # and Linux keep beside the program
  extraResources:
    - from: node_modules/electron/LICENSE
      to: legal/LICENSE.electron.txt
    # Written by beforePack (scripts/notices.mjs) from Electron's zip for the Mac being built
    - from: build/legal/LICENSES.chromium.html
      to: legal/LICENSES.chromium.html
linux:
  icon: resources/icons
  category: Graphics
  synopsis: Image labelling in LabelMe, Pascal VOC, YOLO or CreateML format
  description: Label images with polygons, boxes, brush and eraser, AI segmentation and review of model proposals. Saves LabelMe JSON, Pascal VOC, YOLO and CreateML files.
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  maintainer: Jakhongir Nodirov <jakhon37@gmail.com>
deb:
  depends: [libgtk-3-0, libnotify4, libnss3, libxss1, libxtst6, xdg-utils, libatspi2.0-0, libuuid1, libsecret-1-0]

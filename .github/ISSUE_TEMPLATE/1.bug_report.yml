name: Bug report
description: Something in Seamtag doesn't work as it should
labels: [bug]
body:
  - type: input
    attributes:
      label: Seamtag version
      description: Help → About, or `seamtag --version`, and how you installed it (installer, AppImage, .deb, from source).
    validations:
      required: true
  - type: input
    attributes:
      label: System
      description: 'For example: Windows 11, macOS 15 on Apple silicon, Ubuntu 24.04'
    validations:
      required: true
  - type: textarea
    attributes:
      label: What happened
      description: What you did, and what went wrong. Paste any error message as text.
    validations:
      required: true
  - type: textarea
    attributes:
      label: What you expected
  - type: textarea
    attributes:
      label: Steps to reproduce
      description: From opening the folder to the problem. If one image, label file or dataset causes it, attach it, or a small copy that does the same, and the lines of `~/.seamtagrc` you changed.
  - type: markdown
    attributes:
      value: Please report security problems privately, as [SECURITY.md](https://github.com/jakhon37/Seamtag/blob/main/SECURITY.md) says, not here.

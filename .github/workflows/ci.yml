name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx electron-vite build
      # Ubuntu's AppArmor keeps apps without a profile from the user namespaces Chromium's sandbox uses
      - name: Allow Chromium's sandbox
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: End-to-end tests
        # Chromium's GPU process wants a display even for a headless window, and Linux runners have none
        run: ${{ runner.os == 'Linux' && 'xvfb-run -a ' || '' }}npx playwright test --reporter=line
        env:
          E2E_SHOTS: ${{ runner.temp }}/shots
          # Prints the app's own output, which is all there is to go on when a launch fails
          DEBUG: pw:browser
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-${{ matrix.os }}
          path: |
            test-results
            ${{ runner.temp }}/shots
          retention-days: 7

  labelme-reads:
    # Files this app writes must load in labelme itself, old and new
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: astral-sh/setup-uv@v10.3.3
      - run: npm ci
      - run: npx electron-vite build
      - name: Allow Chromium's sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Write label files with the app
        run: xvfb-run -a npx playwright test e2e/labelme.spec.ts e2e/ai.spec.ts e2e/labelimg.spec.ts --reporter=line
        env:
          E2E_DIR: ${{ runner.temp }}/e2e
      # labelme 7 loads Qt's GUI module, which needs GL libraries the runner image leaves out
      - name: Libraries for Qt
        run: |
          sudo apt-get update -q > /dev/null
          sudo apt-get install -y -q libegl1 libgl1 libxkbcommon0 libfontconfig1 > /dev/null
      - name: Load them with labelme 7 and labelme 5
        shell: bash
        run: |
          files=$(ls ${{ runner.temp }}/e2e/{shapes/s,dialog/q,prelabel/p1,edit/a,output-labels/o,labelimg-tools/a,verify/q}.json)
          uv run --no-project --python 3.12 --with labelme python tests/parity/labelme_reads.py $files
          uv run --no-project --python 3.12 --with 'labelme==5.8.1' python tests/parity/labelme_reads.py $files

  labelimg-reads:
    # Pascal VOC, YOLO and CreateML files this app writes must load in LabelImg itself, and be
    # byte for byte what LabelImg writes for the same boxes
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: astral-sh/setup-uv@v10.3.3
      - run: npm ci
      - run: npx electron-vite build
      - name: Allow Chromium's sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Write label files with the app
        run: xvfb-run -a npx playwright test e2e/labelimg.spec.ts --reporter=line
        env:
          E2E_DIR: ${{ runner.temp }}/e2e
      # LabelImg's label file code loads Qt's GUI module too
      - name: Libraries for Qt
        run: |
          sudo apt-get update -q > /dev/null
          sudo apt-get install -y -q libegl1 libgl1 libxkbcommon0 libfontconfig1 > /dev/null
      - name: Read and write them with LabelImg 1.8.6 and its master branch
        shell: bash
        run: |
          dir=${{ runner.temp }}/e2e
          uv run --no-project --python 3.12 --with 'labelImg==1.8.6' python tests/parity/labelimg_reads.py $dir/labelimg $dir/labelimg-expected.json
          uv run --no-project --python 3.12 --with 'labelImg @ git+https://github.com/HumanSignal/labelImg@b33f965' python tests/parity/labelimg_reads.py $dir/labelimg $dir/labelimg-expected.json

  coco-reads:
    # COCO files this app writes must load, decode, measure and score in pycocotools
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: astral-sh/setup-uv@v10.3.3
      - run: npm ci
      - name: Write a COCO sample
        run: npx vitest run tests/unit/coco.test.ts
        env:
          COCO_PARITY_DIR: ${{ runner.temp }}/coco
      - name: Read it with pycocotools 2.0.11
        run: uv run --no-project --python 3.12 --with pycocotools==2.0.11 --with numpy==2.5.4 python -I tests/parity/coco_reads.py ${{ runner.temp }}/coco

  ultralytics-reads:
    # YOLO datasets this app writes must pass Ultralytics 8.4.211's own label checks, without torch
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: astral-sh/setup-uv@v10.3.3
      - run: npm ci
      - name: Write a dataset of each task
        run: npx vitest run tests/unit/ultralytics.test.ts
        env:
          YOLO_PARITY_DIR: ${{ runner.temp }}/yolo
      - name: Read them with Ultralytics' own code
        run: |
          dir=${{ runner.temp }}/yolo
          uv run --no-project --python 3.12 --with numpy==2.3.4 --with pyyaml==6.0.3 --with pillow==12.0.0 python -I tests/parity/ultralytics_reads.py $dir/detect $dir/segment $dir/pose $dir/obb
